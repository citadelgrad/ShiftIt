name: Release

on:
  push:
    tags:
      - 'version-*'

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release

    env:
      PROJECT_PATH: ShiftIt/ShiftIt.xcodeproj
      SCHEME: ShiftIt
      INFO_PLIST: ShiftIt/ShiftIt-Info.plist
      ARCHIVE_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#version-}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_name=ShiftIt-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Stamp version into Info.plist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$INFO_PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$INFO_PLIST"
          echo "Stamped version $VERSION into $INFO_PLIST"

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: |
          xcodebuild -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      # --- Signing Setup ---

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Export for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # --- Build ---

      - name: Build for release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$ARCHIVE_DIR" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH" \
            ENABLE_HARDENED_RUNTIME=YES \
            build | xcpretty || exit 1

      - name: Re-sign app and embedded frameworks
        run: |
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          IDENTITY="Developer ID Application"

          # Re-sign all nested code (Sparkle XPC services, helpers, framework)
          find "$APP_PATH/Contents/Frameworks" -type f -perm +111 -o -name "*.dylib" | while read -r binary; do
            codesign --force --sign "$IDENTITY" --timestamp --options runtime \
              --keychain "$KEYCHAIN_PATH" "$binary" || true
          done

          # Re-sign XPC services
          find "$APP_PATH" -name "*.xpc" -type d | while read -r xpc; do
            codesign --force --deep --sign "$IDENTITY" --timestamp --options runtime \
              --keychain "$KEYCHAIN_PATH" "$xpc"
          done

          # Re-sign nested .app bundles (e.g., Sparkle Updater.app)
          find "$APP_PATH" -name "*.app" -not -path "$APP_PATH" -type d | while read -r nested_app; do
            codesign --force --deep --sign "$IDENTITY" --timestamp --options runtime \
              --keychain "$KEYCHAIN_PATH" "$nested_app"
          done

          # Re-sign the Sparkle framework itself
          find "$APP_PATH" -name "*.framework" -type d | while read -r fw; do
            codesign --force --sign "$IDENTITY" --timestamp --options runtime \
              --keychain "$KEYCHAIN_PATH" "$fw"
          done

          # Finally re-sign the main app
          codesign --force --sign "$IDENTITY" --timestamp --options runtime \
            --keychain "$KEYCHAIN_PATH" "$APP_PATH"

      - name: Verify code signature
        run: |
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "Code signature verified"
          spctl --assess --type exec --verbose=2 "$APP_PATH" || echo "spctl assessment (may require notarization)"

      # --- Package ---

      - name: Create archive
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"
          ditto -ck --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      # --- Notarize ---

      - name: Notarize app
        id: notarize
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"

          # Submit and capture the submission ID
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$ARCHIVE_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID for log fetching
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -m1 'id:' | awk '{print $2}')
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

          # Check if notarization succeeded
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization accepted"
          else
            echo "::error::Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          # Staple the ticket to the app, then re-archive
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          xcrun stapler staple "$APP_PATH"
          rm -f "$ARCHIVE_PATH"
          ditto -ck --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      # --- Sparkle Signing ---

      - name: Sign with Sparkle EdDSA
        id: sparkle
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"

          # Pass key via stdin (-f -) for compatibility with all sign_update versions
          SIGN_OUTPUT=$(echo "$SPARKLE_KEY" | ShiftIt/bin/sign_update "$ARCHIVE_PATH" -f -)
          echo "sign_update output: $SIGN_OUTPUT"

          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          FILE_LENGTH=$(echo "$SIGN_OUTPUT" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          # Fallback: some versions output just the signature string
          if [ -z "$ED_SIGNATURE" ]; then
            ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | head -1)
            FILE_LENGTH=$(stat -f%z "$ARCHIVE_PATH")
          fi

          if [ -z "$ED_SIGNATURE" ]; then
            echo "::error::Failed to get EdDSA signature"
            exit 1
          fi

          echo "signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$FILE_LENGTH" >> "$GITHUB_OUTPUT"

      # --- Update Appcast ---

      - name: Generate appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
          ED_SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          FILE_LENGTH: ${{ steps.sparkle.outputs.length }}
        run: |
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          GITHUB_REPO="citadelgrad/ShiftIt"

          cat > release/appcast.xml << APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
             <channel>
                <title>ShiftIt Changelog</title>
                <link>https://raw.githubusercontent.com/${GITHUB_REPO}/main/release/appcast.xml</link>
                <language>en</language>
                <item>
                   <title>ShiftIt version ${VERSION}</title>
                   <sparkle:releaseNotesLink>
                      https://raw.githubusercontent.com/${GITHUB_REPO}/main/release/release-notes-${VERSION}.html
                   </sparkle:releaseNotesLink>
                   <pubDate>${PUB_DATE}</pubDate>
                   <enclosure
                      url="https://github.com/${GITHUB_REPO}/releases/download/version-${VERSION}/${ARCHIVE_NAME}"
                      sparkle:version="${VERSION}"
                      length="${FILE_LENGTH}"
                      type="application/octet-stream"
                      sparkle:edSignature="${ED_SIGNATURE}" />
                   <sparkle:minimumSystemVersion>14.6</sparkle:minimumSystemVersion>
                </item>
             </channel>
          </rss>
          APPCAST_EOF

      - name: Commit appcast update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add release/appcast.xml
          git commit -m "Update appcast.xml for version $VERSION"
          git push origin main

      # --- GitHub Release ---

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"

          gh release create "$TAG" "$ARCHIVE_PATH" \
            --title "ShiftIt $VERSION" \
            --generate-notes

      # --- Cleanup ---

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
